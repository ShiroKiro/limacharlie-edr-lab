event: NEW_PROCESS
op: and
rules:
  - op: is windows
  - op: or
    rules:
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: mshta.exe
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: regsvr32.exe
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: rundll32.exe
  - case sensitive: false
    op: ends with
    path: event/PARENT/FILE_PATH
    value: powershell.exe

  - action: report
    name: LOLBin spawned by PowerShell (T1218)

